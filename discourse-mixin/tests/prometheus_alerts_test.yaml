rule_files:
- ../prometheus_rules_out/prometheus_alerts.yaml
evaluation_interval: 1m
tests:
- name: DiscourseHigh5xxErrors-single_high
  interval: 1m
  input_series:
  - series: discourse_http_requests{instance="discourse-0:9405",job="discourse",db="default",api="web",verb="GET",type="regular",status="500"}
    values: 0+50x20
  - series: discourse_http_requests{instance="discourse-0:9405",job="discourse",db="default",api="web",verb="GET",type="regular",status="200"}
    values: 0+50x20
  alert_rule_test:
  - eval_time: 3m
    alertname: DiscourseHigh5xxErrors
    exp_alerts: []
  - eval_time: 15m
    alertname: DiscourseHigh5xxErrors
    exp_alerts:
    - exp_labels:
        instance: discourse-0:9405
        job: discourse
        db: default
        api: web
        verb: GET
        type: regular
        status: '500'
        severity: critical
      exp_annotations:
        description: 50.00% of all requests are resulting in 500 status codes, which is above the threshold 10%, indicating a potentially larger issue for discourse-0:9405
        summary: More than 10% of all requests result in a 5XX.
- name: DiscourseHigh5xxErrors-single_low
  interval: 1m
  input_series:
  - series: discourse_http_requests{instance="discourse-0:9405",job="discourse",db="default",api="web",verb="GET",type="regular",status="500"}
    values: 0+1x20
  - series: discourse_http_requests{instance="discourse-0:9405",job="discourse",db="default",api="web",verb="GET",type="regular",status="200"}
    values: 0+99x20
  alert_rule_test:
  - eval_time: 3m
    alertname: DiscourseHigh5xxErrors
    exp_alerts: []
  - eval_time: 15m
    alertname: DiscourseHigh5xxErrors
    exp_alerts: []
