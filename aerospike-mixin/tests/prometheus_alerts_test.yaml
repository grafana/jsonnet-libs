  - series: aerospike_namespace_client_read_success{instance="node",aerospike_cluster="cluster",ns="test",cluster_name="cluster",service="node:3000",storage_engine="memory",job="integrations/aerospike"}
    values: 0+450x15
  alert_rule_test:
  - eval_time: 3m
    alertname: AerospikeHighClientReadErrorRate
    exp_alerts: []
  - eval_time: 15m
    alertname: AerospikeHighClientReadErrorRate
    exp_alerts: []
