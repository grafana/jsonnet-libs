    exp_alerts: []
- name: AerospikeHighClientReadErrorRate-boundary
  interval: 1m
  input_series:
  - series: aerospike_namespace_client_read_error{instance="node",aerospike_cluster="cluster",ns="test",cluster_name="cluster",service="node:3000",storage_engine="memory",job="integrations/aerospike"}
