groups:
    - name: vultr-alerts
      rules:
        - alert: VultrMetricsDown
          annotations:
            description: Grafana is no longer receiving metrics for the Vultr integration from instance {{$labels.instance}}.
            summary: Vultr metrics are down.
          expr: |
            up{} == 0
          for: 5m
          labels:
            severity: critical
        - alert: VultrInstanceHighCPUUsage
          annotations:
            description: CPU usage on Vultr instance {{ $labels.label }} in {{ $labels.region }} is {{ printf "%.0f" $value }}%, above the threshold of 90%.
            summary: Vultr instance CPU usage is high.
          expr: vultr_instance_cpu_usage_percent{} > 90
          for: 15m
          labels:
            severity: warning
        - alert: VultrBandwidthAllowanceWarning
          annotations:
            description: Vultr instances have used {{ printf "%.0f" $value }}% of their pooled outbound bandwidth allowance this billing period, above the threshold of 80%.
            summary: Vultr instances are close to their pooled bandwidth allowance.
          expr: 100 * sum by (job) (vultr_instance_bandwidth_tx_bytes_total{}) / (sum by (job) (vultr_instance_bandwidth_allowed_bytes{}) > 0) > 80
          for: 5m
          labels:
            severity: warning
        - alert: VultrBandwidthAllowanceCritical
          annotations:
            description: Vultr instances have used {{ printf "%.0f" $value }}% of their pooled outbound bandwidth allowance this billing period, above the threshold of 95%. Overage charges may apply.
            summary: Vultr instances have nearly used their pooled bandwidth allowance.
          expr: 100 * sum by (job) (vultr_instance_bandwidth_tx_bytes_total{}) / (sum by (job) (vultr_instance_bandwidth_allowed_bytes{}) > 0) > 95
          for: 5m
          labels:
            severity: critical
        - alert: VultrInstanceGPUHighTemperature
          annotations:
            description: GPU temperature on Vultr instance {{ $labels.label }} in {{ $labels.region }} is {{ printf "%.0f" $value }}°C, above the threshold of 85°C.
            summary: Vultr instance GPU temperature is high.
          expr: vultr_instance_gpu_temperature_celsius{} > 85
          for: 10m
          labels:
            severity: warning
