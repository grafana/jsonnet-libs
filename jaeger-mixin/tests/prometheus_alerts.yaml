    values: 0+0x100
  alert_rule_test:
  - eval_time: 10m
    alertname: JaegerAgentSpansDropped
    exp_alerts: []
  - eval_time: 20m
    alertname: JaegerAgentSpansDropped
    exp_alerts: []
