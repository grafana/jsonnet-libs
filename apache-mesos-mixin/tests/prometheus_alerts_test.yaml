      exp_annotations:
        description: 100 percent disk usage on cluster, which is above the threshold of 90.
        summary: There is a high disk usage for the cluster.
- name: ApacheMesosHighDiskUsage-low
  interval: 1m
  input_series:
  - series: mesos_master_disk{type="percent",instance="master",job="integrations/apache-mesos",mesos_cluster="cluster"}
