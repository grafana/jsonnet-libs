              job: integrations/snmp/net.cisco.c7600
              instance: net.cisco.c7600
              module: if_mib
              severity: info
            exp_annotations:
              summary: SNMP exporter scrape is slow.
              description: |
                SNMP exporter scrape of net.cisco.c7600 is taking more than 25 seconds. Please check SNMP modules polled and that snmp_exporter is located on the same network as the SNMP target.

