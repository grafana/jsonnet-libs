      - series: snmp_scrape_duration_seconds{job="integrations/snmp/net.cisco.c7600",instance="net.cisco.c7600",module="if_mib"}
        values: 28x20
      - series: snmp_scrape_duration_seconds{job="integrations/snmp/net.cisco.c7600",instance="net.cisco.c7600",module="system"}
        values: 2x20
