rule_files:
- ../prometheus_rules_out/prometheus_alerts.yaml
evaluation_interval: 1m
tests:
- name: ApacheActiveMQHighStoreMemoryUsage-high
  interval: 1m
  input_series:
  - series: activemq_store_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.8+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts:
    - exp_labels:
        instance: broker
        activemq_cluster: cluster
        job: integrations/apache-activemq
        severity: warning
      exp_annotations:
        description: 80 percent of store memory used on broker in cluster cluster, which is above the threshold of 70 percent.
        summary: Store memory usage is high, which may result in producers unable to send messages.
- name: ApacheActiveMQHighStoreMemoryUsage-near_full
  interval: 1m
  input_series:
  - series: activemq_store_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.95+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts:
    - exp_labels:
        instance: broker
        activemq_cluster: cluster
        job: integrations/apache-activemq
        severity: warning
      exp_annotations:
        description: 95 percent of store memory used on broker in cluster cluster, which is above the threshold of 70 percent.
        summary: Store memory usage is high, which may result in producers unable to send messages.
- name: ApacheActiveMQHighStoreMemoryUsage-low
  interval: 1m
  input_series:
  - series: activemq_store_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.5+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
- name: ApacheActiveMQHighStoreMemoryUsage-boundary
  interval: 1m
  input_series:
  - series: activemq_store_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.7+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighStoreMemoryUsage
    exp_alerts: []
- name: ApacheActiveMQHighTemporaryMemoryUsage-high
  interval: 1m
  input_series:
  - series: activemq_temp_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.8+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts:
    - exp_labels:
        instance: broker
        activemq_cluster: cluster
        job: integrations/apache-activemq
        severity: warning
      exp_annotations:
        description: 80 percent of temporary memory used on broker in cluster cluster, which is above the threshold of 70 percent.
        summary: Temporary memory usage is high, which may result in saturation of messaging throughput.
- name: ApacheActiveMQHighTemporaryMemoryUsage-near_full
  interval: 1m
  input_series:
  - series: activemq_temp_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.95+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts:
    - exp_labels:
        instance: broker
        activemq_cluster: cluster
        job: integrations/apache-activemq
        severity: warning
      exp_annotations:
        description: 95 percent of temporary memory used on broker in cluster cluster, which is above the threshold of 70 percent.
        summary: Temporary memory usage is high, which may result in saturation of messaging throughput.
- name: ApacheActiveMQHighTemporaryMemoryUsage-low
  interval: 1m
  input_series:
  - series: activemq_temp_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.5+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
- name: ApacheActiveMQHighTemporaryMemoryUsage-boundary
  interval: 1m
  input_series:
  - series: activemq_temp_usage_ratio{instance="broker",activemq_cluster="cluster",job="integrations/apache-activemq"}
    values: 0.7+0x15
  alert_rule_test:
  - eval_time: 3m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
  - eval_time: 15m
    alertname: ApacheActiveMQHighTemporaryMemoryUsage
    exp_alerts: []
